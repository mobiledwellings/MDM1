<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Top eyebrow -->
  <text x="600" y="118" text-anchor="middle"
        font-family="-apple-system, Segoe UI, Roboto, sans-serif"
        font-size="22" font-weight="500" letter-spacing="6"
        fill="#737373">MOBILE DWELLINGS  ×  SIGNATURE SOLAR</text>

  <!-- Headline -->
  <text x="600" y="200" text-anchor="middle"
        font-family="-apple-system, Segoe UI, Roboto, sans-serif"
        font-size="44" font-weight="700"
        fill="#ffffff">Signature Solar Coupon Code</text>

  <!-- Coupon code box -->
  <rect x="200" y="245" width="800" height="200" rx="14" ry="14"
        fill="none" stroke="#404040" stroke-width="2"/>
  <text x="600" y="295" text-anchor="middle"
        font-family="-apple-system, Segoe UI, Roboto, sans-serif"
        font-size="18" font-weight="500" letter-spacing="5"
        fill="#737373">YOUR COUPON CODE</text>
  <text x="600" y="400" text-anchor="middle"
        font-family="-apple-system, Segoe UI, Roboto, sans-serif"
        font-size="120" font-weight="900" letter-spacing="14"
        fill="#ffffff">MD50OFF</text>

  <!-- Value prop -->
  <text x="600" y="495" text-anchor="middle"
        font-family="-apple-system, Segoe UI, Roboto, sans-serif"
        font-size="28" font-weight="500"
        fill="#d4d4d4">$50 off any order over $500 at signaturesolar.com</text>

  <!-- Footer line -->
  <text x="600" y="560" text-anchor="middle"
        font-family="-apple-system, Segoe UI, Roboto, sans-serif"
        font-size="20" font-weight="500"
        fill="#737373">Verified by Justin Smith  ·  mobiledwellings.media</text>
</svg>
